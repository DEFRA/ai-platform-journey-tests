# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/how-to/sonarcloud.md
# Uncomment the SonarCloud Scan step in check-pull-request.yml and publish.yml once SONAR_TOKEN is added.
sonar.projectKey=DEFRA_ai-platform-journey-tests
sonar.organization=defra
sonar.links.homepage=https://github.com/DEFRA/ai-platform-journey-tests
sonar.links.ci=https://github.com/DEFRA/ai-platform-journey-tests/actions
sonar.links.scm=https://github.com/DEFRA/ai-platform-journey-tests
sonar.links.issue=https://github.com/DEFRA/ai-platform-journey-tests/issues

# This is a WDIO test suite, not an application - source is the tests themselves.
sonar.sources=test/

# No app code to instrument here, so the "coverage on new code" quality gate condition can never be met - exclude it.
sonar.coverage.exclusions=**/*
