name: Run Journey Tests on GitHub

inputs:
  ai-platform-frontend:
    required: false
    type: string
  ai-platform-backend-api:
    required: false
    type: string

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: Docker Login
      uses: DEFRA/cdp-build-action/docker-login@main

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Setup the tests
      run: npm i
      shell: bash
    - name: Start docker compose
      shell: bash
      run: |
          AI_PLATFORM_FRONTEND=${{inputs.ai-platform-frontend}} \
          AI_PLATFORM_BACKEND_API=${{inputs.ai-platform-backend-api}} \
          docker compose up --wait-timeout 300 -d --quiet-pull
    - name: Run the tests
      shell: bash
      run: |
        npm run test:github
        npm run report
    - name: debug
      if: always()
      run: |
        docker compose logs > logs.txt
        docker ps
      shell: bash
    - name: Upload allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./allure-report
    - name: Upload docker compose logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-compose-logs
        path: ./logs.txt
