name: Run Journey Tests on GitHub

permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write

on:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    name: Run Journey Tests
    # Pinned for the same reason as check-pull-request.yml: WebdriverIO's
    # xvfb workers fail with "write EINVAL" on ubuntu-26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./run-journey-tests
