################################################################################
# Docker Compose file for starting up the service for testing in GitHub workflow
# This template provides comparable infrastructure to the real environment.
#   - mongodb
#   - redis
#   - localstack (s3, sqs, sns)
#
# Both mongo and localstack have init scripts included for setting up resources
# on startup. These scripts are in docker/scripts.
#
# It also includes a selenium-chrome container for running the browser headless.
#
# The services being tested can either be started up here using the latest
# builds from dockerhub.
# In the example each service has a .env config file in docker/config/
# Services can reference each other by their container names.
# e.g. http://cdp-example-node-backend:3001/
#
################################################################################
services:

################################################################################
# Headless browser, used by the test suite to actually run the tests against the
# containers.
  selenium-chrome:
    image: selenium/standalone-chrome:123.0
    environment:
      # The no-script journey opens a second browser while the runner's stays
      # open, so the node needs room for two sessions (the default is one).
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    ports:
      - 4444:4444

################################################################################
  mongodb:
    image: mongo:6
    volumes:
      - ./docker/scripts/mongodb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 5s
      start_period: 5s
      retries: 3
################################################################################
  localstack:
    image: localstack/localstack:3.2.0
    environment:
      - LOCALSTACK_HOST=127.0.0.1
      - SERVICES=s3,sqs,sns,dynamodb
      - LS_LOG=WARN
    env_file:
      - ./docker/config/defaults.env
    volumes:
      - ./docker/scripts/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "localhost:4566"]
      interval: 5s
      start_period: 5s
      retries: 3

################################################################################
  redis:
    image: redis:7
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "PING" ]
      interval: 5s
      start_period: 2s
      retries: 5


################################################################################
# App-only tokens for the signed-out catalogue journeys. This local issuer uses
# fixed test IDs and a throwaway key; it is not suitable for deployed services.
  mock-oidc:
    build:
      context: ./docker/mock-oidc
    env_file:
      - ./docker/config/example-auth.env
    environment:
      - OIDC_MOCK_ISSUER_URL=http://mock-oidc:3100
      - PORT=3100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      start_period: 2s
      retries: 5


################################################################################
#
# Add the services you want to test below.
#
################################################################################
  ai-platform-frontend:
    build:
      context: ./docker/mock-frontend
      args:
        FRONTEND_IMAGE: ${AI_PLATFORM_FRONTEND:-latest}
    image: ai-platform-journey-tests-frontend:local
    env_file:
      - ./docker/config/defaults.env
      - ./docker/config/example-frontend.env
      - ./docker/config/example-auth.env
    environment:
      - PORT=3000
      - NODE_ENV=development
      - LOG_FORMAT=ecs
      - OIDC_MOCK_ISSUER_URL=http://mock-oidc:3100
    depends_on:
      ai-platform-backend-api:
        condition: service_started
      redis:
        condition: service_healthy
      mock-oidc:
        condition: service_healthy
    ports:
      - 3000:3000
    healthcheck:
      test: ["CMD", "curl", "http://localhost:3000/health"]
      interval: 3s
      start_period: 2s
      retries: 3

################################################################################
  ai-platform-backend-api:
    image: defradigital/ai-platform-backend-api:${AI_PLATFORM_BACKEND_API:-latest}
    env_file:
      - ./docker/config/defaults.env
      - ./docker/config/example-backend.env
      - ./docker/config/example-auth.env
    environment:
      - PORT=3001
      - NODE_ENV=development
      - PORTAL_AUTH_MOCK_ISSUER_URL=http://mock-oidc:3100
      # Team requests go through the mock orchestrator: no GitHub, SQS or
      # worker is needed, and each stage takes a few seconds so a journey can
      # watch a request move. It also honours the forced-failure marker in a
      # request's purpose that the failure journeys use.
      - TENANT_ORCHESTRATOR=mock
      - TEAM_DEPLOYMENT_MOCK_STAGE_DURATION_MS=3000
    depends_on:
      mongodb:
        condition: service_healthy
      mock-oidc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:3001/health"]
      interval: 3s
      start_period: 2s
      retries: 3
